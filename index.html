<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Shivam Media — Creative production agency for video editing, AI production, thumbnails, sound design and storytelling.">

<title>Shivam Media — Creative Production Agency</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#080808;
  color:#f5f5f5;
  line-height:1.5;
}

a{
  color:inherit;
  text-decoration:none;
}

.container{
  width:min(1180px,92%);
  margin:auto;
}

/* NAVBAR */
header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:1000;
  background:rgba(8,8,8,.88);
  backdrop-filter:blur(15px);
  border-bottom:1px solid #222;
}

.nav{
  height:78px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:22px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  color:#999;
}

.nav-links{
  display:flex;
  gap:30px;
  align-items:center;
}

.nav-links a{
  font-size:14px;
  color:#aaa;
  transition:.3s;
}

.nav-links a:hover{
  color:#fff;
}

.nav-btn{
  border:1px solid #444;
  padding:11px 18px;
  border-radius:30px;
  color:#fff !important;
}

.menu{
  display:none;
  font-size:26px;
  cursor:pointer;
}

/* HERO */
.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  padding-top:110px;
  position:relative;
  overflow:hidden;
}

.hero:before{
  content:"";
  position:absolute;
  width:500px;
  height:500px;
  background:#222;
  filter:blur(120px);
  border-radius:50%;
  right:-180px;
  top:150px;
  opacity:.35;
}

.eyebrow{
  color:#999;
  text-transform:uppercase;
  letter-spacing:3px;
  font-size:12px;
  margin-bottom:25px;
}

.hero h1{
  font-size:clamp(50px,8vw,105px);
  line-height:.92;
  letter-spacing:-6px;
  max-width:950px;
  margin-bottom:35px;
}

.hero h1 span{
  color:#777;
}

.hero-text{
  max-width:600px;
  color:#999;
  font-size:18px;
  line-height:1.7;
  margin-bottom:40px;
}

.buttons{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
}

.btn{
  display:inline-block;
  padding:15px 24px;
  border-radius:5px;
  background:#fff;
  color:#000;
  font-weight:bold;
  transition:.3s;
}

.btn:hover{
  transform:translateY(-3px);
}

.btn-outline{
  background:transparent;
  color:#fff;
  border:1px solid #444;
}

/* MARQUEE */
.marquee{
  border-top:1px solid #222;
  border-bottom:1px solid #222;
  padding:18px 0;
  overflow:hidden;
  color:#777;
  text-transform:uppercase;
  letter-spacing:3px;
  font-size:12px;
}

.marquee-track{
  white-space:nowrap;
  animation:move 22s linear infinite;
}

.marquee-track span{
  margin-right:50px;
}

@keyframes move{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}

/* SECTION */
section{
  padding:120px 0;
}

.section-top{
  display:flex;
  justify-content:space-between;
  gap:30px;
  margin-bottom:60px;
}

.section-number{
  color:#555;
  font-size:13px;
}

.section-title{
  font-size:clamp(40px,6vw,75px);
  letter-spacing:-4px;
  line-height:.95;
  max-width:700px;
}

.section-desc{
  color:#777;
  max-width:400px;
  line-height:1.7;
}

/* SERVICES */
.services{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  border-top:1px solid #292929;
}

.service{
  padding:40px 20px;
  border-bottom:1px solid #292929;
  transition:.3s;
}

.service:nth-child(odd){
  border-right:1px solid #292929;
}

.service:hover{
  background:#111;
}

.service-num{
  color:#555;
  font-size:12px;
  margin-bottom:45px;
}

.service h3{
  font-size:30px;
  margin-bottom:15px;
}

.service p{
  color:#777;
  max-width:430px;
}

/* WORK */
.work-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}

.project{
  min-height:360px;
  border:1px solid #292929;
  background:#101010;
